  <body style="background-color: #161513; margin: 0; padding: 0;">
    <div id="root">
      <!-- Instant Static Preloader to prevent white flash before Javascript loads -->
      <style>
        html, body {
          background-color: #161513 !important;
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        .static-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #161513;
          z-index: 9999;
          font-family: 'Outfit', sans-serif;
        }
        .static-logo {
          font-size: 3rem;
          font-weight: 900;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          background: linear-gradient(135deg, #ffffff 0%, #e5dfd5 50%, #c5a880 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          animation: static-pulse 1.5s ease-in-out infinite;
        }
        @keyframes static-pulse {
          0%, 100% { opacity: 0.45; transform: scale(0.96); }
          50% { opacity: 1; transform: scale(1.02); }
        }
      </style>
      <div class="static-loader">
        <div class="static-logo">NB</div>
      </div>
    </div>
  </body>
